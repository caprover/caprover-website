name: Verify site integration

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-combined-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            marketing-site/package-lock.json

      - name: Check documentation consolidation inventory
        run: node scripts/check-docs-consolidation.mjs

      - name: Verify translated documentation integrity
        run: node scripts/check-docs-translations.mjs

      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation site
        working-directory: docs-site
        run: npm run clean-build

      - name: Install marketing-site dependencies
        working-directory: marketing-site
        run: npm ci

      - name: Lint marketing site
        working-directory: marketing-site
        run: npm run lint

      - name: Check marketing-site formatting
        working-directory: marketing-site
        run: npm run format:check

      - name: Build and test marketing site
        working-directory: marketing-site
        run: npm test

      - name: Compose and verify combined site
        run: node scripts/compose-site.mjs

      - name: Smoke test combined site
        run: node scripts/smoke-combined-site.mjs

      - name: Test documentation redirect resolver
        run: node --test scripts/docs-redirects.test.mjs

      - name: Validate every historical documentation route and fragment
        run: node scripts/check-docs-redirects.mjs

      - name: Install browser test runtime
        working-directory: docs-site
        run: npx playwright install --with-deps chromium

      - name: Verify browser documentation navigation
        run: docs-site/node_modules/.bin/playwright test

      - name: Upload combined site preview
        uses: actions/upload-artifact@v4
        with:
          name: combined-site-preview
          path: build/combined-site
          if-no-files-found: error
          retention-days: 7
