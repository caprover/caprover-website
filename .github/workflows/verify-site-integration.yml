name: Verify site integration

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-combined-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js for Docusaurus
        uses: actions/setup-node@v5
        with:
          node-version: 10

      - name: Build documentation site
        working-directory: docs-site
        run: |
          npm install
          npm run clean-build

      - name: Set up Node.js for marketing site
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing-site/package-lock.json

      - name: Install marketing-site dependencies
        working-directory: marketing-site
        run: npm ci

      - name: Lint marketing site
        working-directory: marketing-site
        run: npm run lint

      - name: Check marketing-site formatting
        working-directory: marketing-site
        run: npm run format:check

      - name: Build and test marketing site
        working-directory: marketing-site
        run: npm test

      - name: Compose and verify combined site
        run: node scripts/compose-site.mjs

      - name: Smoke test combined site
        run: node scripts/smoke-combined-site.mjs

      - name: Upload combined site preview
        uses: actions/upload-artifact@v4
        with:
          name: combined-site-preview
          path: build/combined-site
          if-no-files-found: error
          retention-days: 7
