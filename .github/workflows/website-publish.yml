name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            marketing-site/package-lock.json

      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation site
        working-directory: docs-site
        run: npm run clean-build

      - name: Install marketing-site dependencies
        working-directory: marketing-site
        run: npm ci

      - name: Lint marketing site
        working-directory: marketing-site
        run: npm run lint

      - name: Check marketing-site formatting
        working-directory: marketing-site
        run: npm run format:check

      - name: Build and test marketing site
        working-directory: marketing-site
        run: npm test

      - name: Compose and verify combined site
        run: node scripts/compose-site.mjs

      - name: Smoke test combined site
        run: node scripts/smoke-combined-site.mjs

      - name: Publish combined site
        working-directory: docs-site
        env:
          BUILD_DIR: ${{ github.workspace }}/build/combined-site
          GITHUB_PERSONAL_TOKEN: ${{ secrets.GITHUB_PERSONAL_TOKEN }}
        run: ./publish-from-actions.sh
