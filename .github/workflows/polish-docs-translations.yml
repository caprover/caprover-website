name: Polish localized docs terminology (one-time)
on:
  push:
    branches:
      - docs/translate-current-spanish-chinese
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply engineering glossary and structural QA
        run: |
          python -m py_compile scripts/polish-docs-translations.py
          python scripts/polish-docs-translations.py
          node scripts/check-docs-translations.mjs
      - name: Commit editorial corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/es-ES/docs-next content/zh-CN/docs-next
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: normalize Spanish and Chinese engineering terminology'
          git push
