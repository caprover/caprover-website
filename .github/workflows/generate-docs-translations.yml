name: Generate initial translations (one-time)

on:
  push:
    branches:
      - docs/translate-current-spanish-chinese

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation engine
        run: python -m pip install 'argostranslate==1.10.0'
      - name: Translate and structurally validate all 48 pages in both locales
        run: python scripts/generate-docs-translations.py
      - name: Commit draft translations to this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/es-ES/docs-next content/zh-CN/docs-next
          if git diff --cached --quiet; then
            echo 'No translation changes'
            exit 0
          fi
          git commit -m 'docs: add 48 machine-drafted Spanish and Chinese translations'
          git push
